[project]
name = "botfactory"
version = "1.0.0"
description = "Telegram bot factory for audio/video content providers (aiogram 3)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy[asyncio]>=2.0,<2.2",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "cryptography>=42",
    "pydantic-settings>=2.2",
    "jdatetime>=5",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["botfactory*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
