services:
  botfactory:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"   # پشت یک reverse proxy (nginx/caddy) با HTTPS قرار دهید
    volumes:
      - ./data:/app/data

