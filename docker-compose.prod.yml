# استقرار تولیدی: ربات + Caddy (HTTPS خودکار).
# قبل از اجرا در .env مقدار DOMAIN و BASE_URL=https://DOMAIN را بگذارید. راهنما: DEPLOY.md
services:
  botmother:
    image: ghcr.io/mkstatoo/botmother:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: webhook
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - botmother
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN را در .env تنظیم کنید}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
